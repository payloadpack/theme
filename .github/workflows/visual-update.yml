name: Update visual baselines

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: payloadpack-visual-update-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.15.0'
  BUN_VERSION: '1.4.4'

jobs:
  record:
    if: github.event.label.name == 'update-visuals' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install unzip for the Bun installer
        run: apt-get update && apt-get install --yes --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build
        working-directory: packages/theme

      - name: Record the screenshots
        run: rm -rf tests/__visual__ && bun run test:visual --update-snapshots=all
        working-directory: apps/demo
        env:
          PAYLOAD_SECRET: ci-only-secret

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/demo/tests/__visual__/*-linux.png
          if-no-files-found: error

  commit:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Replace the baselines with the recorded screenshots
        run: rm -rf apps/demo/tests/__visual__

      - name: Download the screenshots
        uses: actions/download-artifact@v4
        with:
          name: visual-baselines
          path: apps/demo/tests/__visual__

      - name: Check that the artifact holds only screenshots
        run: |
          unexpected="$(find apps/demo/tests/__visual__ -mindepth 1 ! \( -type f -name '*-linux.png' \))"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files in the artifact:" "$unexpected"
            exit 1
          fi

      - name: Commit the new baselines
        env:
          GITHUB_API_TOKEN: ${{ secrets.PAYLOADPACK_RELEASE_BOT_TOKEN }}
          PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all apps/demo/tests/__visual__
          if git diff --cached --quiet; then
            echo "The baselines already match."
          else
            git commit -m "test(demo): update visual baselines"
            git push "https://x-access-token:${GITHUB_API_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$PULL_REQUEST_BRANCH"
          fi

  remove-label:
    needs: [record, commit]
    if: always() && github.event.label.name == 'update-visuals' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove the label
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
          LABELS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/update-visuals
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request DELETE --header "Authorization: Bearer $GITHUB_API_TOKEN" "$LABELS_URL")"
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then
            echo "Removing the label failed with HTTP $status"
            exit 1
          fi
