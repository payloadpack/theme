name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: payloadpack-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      theme_release_created: ${{ steps.rp.outputs['packages/theme--release_created'] }}

    steps:
      - name: Run Release Please (manifest)
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PAYLOADPACK_RELEASE_BOT_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: ${{ needs.release.outputs.theme_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        run: npm publish
        working-directory: packages/theme

  docs:
    needs: release
    if: ${{ needs.release.outputs.theme_release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/docs.yml
