name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '24.15.0'
  BUN_VERSION: '1.4.4'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether only docs changed
        id: docs_check
        if: github.event_name == 'pull_request'
        run: echo "docs_only=$(git diff --quiet --no-renames HEAD^1 HEAD -- ':!*.md' ':!*.png' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build
        working-directory: packages/theme

      - name: Contract tests
        run: bun run test
        working-directory: packages/theme

      - name: Type-check demo
        run: bun run typecheck
        working-directory: apps/demo

      - name: Install Playwright browser
        if: steps.docs_check.outputs.docs_only != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/demo

      - name: End-to-end tests
        if: steps.docs_check.outputs.docs_only != 'true'
        run: bun run test:e2e
        working-directory: apps/demo
        env:
          CI: 'true'
          PAYLOAD_SECRET: ci-only-secret
