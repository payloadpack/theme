<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        src: url('../../../packages/theme/src/fonts/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
      }

      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 40px 64px 0;
        background:
          radial-gradient(ellipse 55% 60% at 50% 100%, rgb(16 185 129 / 0.18), transparent 70%),
          radial-gradient(ellipse 50% 60% at 100% 0%, rgb(6 182 212 / 0.12), transparent 70%), #0b0c0e;
        color: #f4f4f5;
        font-family: Geist, sans-serif;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #a1a1aa;
        font-size: 20px;
        font-weight: 500;
      }

      .brand img {
        width: 26px;
        height: 26px;
      }

      h1 {
        margin-top: 16px;
        font-size: 60px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      .tagline {
        margin-top: 12px;
        color: #c4c4cc;
        font-size: 24px;
        letter-spacing: -0.005em;
      }

      .admin-window-glow {
        flex: 1;
        min-height: 0;
        margin-top: 26px;
        filter: drop-shadow(0 -8px 28px rgb(16 185 129 / 0.3));
      }

      .admin-window {
        overflow: hidden;
        height: 100%;
        border: 1px solid rgb(255 255 255 / 0.12);
        border-bottom: 0;
        border-radius: 14px 14px 0 0;
        background: #18181b;
        mask-image: linear-gradient(to bottom, #000 72%, transparent);
      }

      .admin-window-bar {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 22px;
        padding-left: 12px;
        border-bottom: 1px solid rgb(255 255 255 / 0.06);
        background: #1c1c20;
      }

      .admin-window-bar span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #3f3f46;
      }

      .admin-screenshot {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../../../.github/assets/icons/logo-dark.svg" alt="" />payloadpack/theme</div>
    <h1>Custom Admin UI Theme for Payload v4</h1>
    <p class="tagline">Three styles and four palettes, in light and dark.</p>
    <div class="admin-window-glow">
      <div class="admin-window">
        <div class="admin-window-bar"><span></span><span></span><span></span></div>
        <img class="admin-screenshot" alt="" />
      </div>
    </div>
  </body>
</html>
